# Simple workflow for running vue.js mounted component tests
name: Run Component Tests

on:
  # Runs on all branches except main
  push:
    branches:
      - '**'
      - '!main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      validate-src: ${{ steps.check.outputs.validate-src }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: check
      with:
        filters: |
          validate-src:
            - 'src/**'
            - 'test/**'
            - '.github/workflows/validate.yml'

  component-tests:
      needs: detect-changes
      runs-on: ubuntu-latest
      if: needs.detect-changes.outputs.validate-src == 'true'

      steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Run Component Tests
        run: pnpm run test:components

  a11y-tests:
      needs: detect-changes
      runs-on: ubuntu-latest
      if: needs.detect-changes.outputs.validate-src == 'true'
      # Keep this tag's version in lockstep with the `playwright` version in package.json.
      # Using containers instead of installing playwright all the time:
      # https://playwright.dev/docs/ci#via-containers
      container:
        image: mcr.microsoft.com/playwright:v1.61.1-noble
        options: --ipc=host

      steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility Tests
        run: pnpm run test:a11y
