# Simple workflow for running vue.js mounted component tests
name: Run Component Tests

on:
  # Runs on all branches except main
  push:
    branches:
      - '**'
      - '!main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      validate-src: ${{ steps.check.outputs.validate-src }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: check
      with:
        filters: |
          validate-src:
            - 'src/**'
            - 'test/**'
            - '.github/workflows/validate.yml'

  lint:
      needs: detect-changes
      runs-on: ubuntu-latest
      if: needs.detect-changes.outputs.validate-src == 'true'

      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

  component-tests:
      needs: detect-changes
      runs-on: ubuntu-latest
      if: needs.detect-changes.outputs.validate-src == 'true'

      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Run Component Tests
        run: pnpm run test:components

  a11y-tests:
      needs: detect-changes
      runs-on: ubuntu-latest
      if: needs.detect-changes.outputs.validate-src == 'true'
      # Keep this tag's version in lockstep with the `playwright` version in package.json.
      # Using containers instead of installing playwright all the time:
      # https://playwright.dev/docs/ci#via-containers
      container:
        image: mcr.microsoft.com/playwright:v1.62.1-noble
        options: --ipc=host

      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Run Accessibility Tests
        run: pnpm run test:a11y
